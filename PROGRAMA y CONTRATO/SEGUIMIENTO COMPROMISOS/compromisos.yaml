    fuente_contractual: "NT P22-NT-09-000-002-0, Seccion 2 Authority: el Tercero Inspector actua como REPRESENTANTE DE ADASA para los Puntos de Detencion y la emision de registros, con la hidrostatica dentro de su alcance. Oferta BV 600049 Rev.3 seccion 1 (velar por los intereses del cliente, con revision de planos y procedimientos) y seccion 3.2 (Flash Report en la misma visita ante No Conformidad o desviacion), contratada por la Orden de Compra 836492. Guia del Paquete ADASA-BV-PAQUETE-INSPECCION Rev 1 seccion 3.4, que le entrego el P&ID como trazado maestro para hidrostatica y la Line List para las visitas 2 y 3"
    origen_fecha: FIJADA ADASA
    fecha_origen: 2026-08-21
    fecha_cierre: 2026-09-07
    consecuencia: "Dos informes consecutivos declaran conforme un ensayo que no califica, y el del 20-Ago lo hace SIN COMENTARIO ALGUNO: marca Satisfactory (Without comments) con No Conformidades y punch list en No. Entre los dos consignan 5,0 barG de presion de diseno para TRES lineas que la Line List fija en 80, 90 y 80 barG. Si entran al dossier asi, el Punto de Detencion de la fila 5.2 queda respaldado por un atestiguamiento que nunca contrasto el parametro central contra el documento que lo gobierna. Y ADASA no tiene como detectarlo por su cuenta: el modulo se fabrica a mas de 17.000 km y sobre la identidad de lo ensayado el inspector presente es el unico control. El registro fotografico no lo suple, porque ninguna imagen de la seccion I de los dos informes muestra una marca de identificacion del carrete y la del IR006 rotula UNA sola foto con DOS numeros de linea distintos"
    accion_adasa: "ADASA reserva su posicion sobre la validez del atestiguamiento de los dias 20 y 21 y tiene los TRES ensayos por no ejecutados. La retencion de la fila 5.2 se comunica tambien al inspector. El correo sube de tono y encuadra el reclamo en el ROL: que contrato ADASA al designar un tercero inspector, que es el contraste independiente contra la ingenieria aprobada. Cierra llamando al trabajo conjunto y sin objetar el desempeno en terreno, porque el inspector asistio, firmo, reviso los certificados y fotografio los escalones"
    evidencia_origen: "PROGRAMA y CONTRATO/HITO BUREAU VERITAS/04 INFORMES BV/IR005 2026-08-20/IR005-ADASA-BVM-20082026.pdf secciones A, B, D, E1 y G, mas su Annex 1 (cuatro certificados, dos de rango 0 a 160 bar); PROGRAMA y CONTRATO/HITO BUREAU VERITAS/04 INFORMES BV/IR006 2026-08-21/IR006-ADASA-BVM-21082026.pdf mismas secciones; los dos analisis _ANALISIS_INSPECCION_05.md y _ANALISIS_INSPECCION_06.md; correo ENVIADO el 21-Ago a las 12:15:49 hora de Chile, respaldo en CORREOS/Agosto 2026/2026-08-21/Re: 25007 TALTAL -  Request to witness inspection 006.pdf (respaldo del enviado, 21-Ago 12:15:49 hora de Chile)"
    evidencia_cierre: "Set completo IR001 a IR009 remitido por Carlo Montecinos el 31-Ago-2026 14:47 por la cadena del Request 006, archivado en PROGRAMA y CONTRATO/HITO BUREAU VERITAS/04 INFORMES BV/ con analisis en _REGISTRO_INSPECCIONES_BV.md. CUATRO de las SEIS peticiones cerradas, verificadas por render del formulario: (1) los dos informes reemitidos declaran la presion de diseno de la Line List y marcan las tres lineas Unsatisfactory; (2) el IR005 pasa de Satisfactory (Without comments) a NOT SATISFACTORY y el IR006 de Satisfactory with comments a NOT SATISFACTORY; (3) el P&ID Rev D y la Line List Rev 0 entran a la seccion B de los dos reemitidos y de los informes IR008 e IR009; (4) desde el IR008 el registro fotografico incluye la fotografia rotulada View of spool identification for pressure test con la marca del carrete visible. Las dos que faltaban se completaron con la reemision del 7-Sep-2026 que remitio Jaime Martinez a las 18:43 por la cadena del Request 006, en respuesta al correo ADASA del 31-Ago, archivada en PROGRAMA y CONTRATO/HITO BUREAU VERITAS/04 INFORMES BV/IR005 2026-08-20/, IR006 2026-08-21/ e IR007 2026-08-24/, subcarpeta REEMISION BV 2026-09-07/: los dos informes declaran Revision No. 1, marcan Not Satisfactory y Open Non Conformities Yes, y levantan la No Conformidad en su seccion G (verificado por render y por texto el 5-Oct-2026). Las tres lineas quedaron ademas conformes a su presion: CP-SSD-DN80-09-044 en el BVM-IR011 del 3-Sep y CP-SSD-DN100-09-014 y CP-SSD-DN80-09-015 en el BVM-IR013 del 9-Sep"
    ref_cruzada: "BV-23, BV-25, PRG-34, PRG-36"
    reprogramaciones: 0
    historial_fechas: "Abierto el 21-Ago-2026 con el correo ENVIADO a las 12:15:49 hora de Chile a Carlo Montecinos, con Victor Gutierrez en copia. Respondido parcialmente el 27-Ago (Bureau Veritas Malasia declara por Carlo que todos los comentarios estaban atendidos) y cerrado parcialmente el 31-Ago-2026 con la entrega del set completo. El equipo de Bureau Veritas Malasia quedo fuera de la copia por decision del usuario: el reclamo va a la contraparte de la OC 836492. Plazo al lunes 24-Ago"
    nota: "CORRECCION del 21-Ago: la primera version de este compromiso exigia el informe del 20-Ago por no haber llegado. ES FALSO. El BVM-IR005 lo remitio Emylia Rosli el 20-Ago 23:35 hora de Chile con Luis Rivera en copia, por la cadena del Request 004 — tercera cadena del frente, y de ahi salio el error. Llego DENTRO del plazo de la seccion 3, y el correo lo acusa expresamente para acotar el reclamo a su contenido. Calibracion: el IR005 SI marca Satisfactory (Without comments), sin salvedad; el IR006 marca Satisfactory with comments. El correo distingue los dos. Y no es falta de instrumentacion: el 20-Ago habia dos manometros de 0 a 160 bar en la mesa, usados esa misma manana para el ensayo a 90 barG. El punto que lo cierra todo sale del propio informe: el inspector CORRIGIO el prefijo del TAG (escribio CP-SSD-DN100-09-014 donde el formulario del fabricante decia DA-SSD-) y aun con el numero correcto delante consigno 5,0 barG sobre una linea que la Line List fija en 80"

