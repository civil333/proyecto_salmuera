  - id: PRG-49
    frente: PROGRAMA
    obligado: BW WATER
    beneficiario: ADASA
    compromiso: "Entregar el paquete de izaje del modulo y ampliar a el el alcance de la revision estructural encargada el 09-Sep-2026"
    fecha_comprometida: 2026-09-17
    estado: ABIERTO
    criticidad: ALTA
    criterio_cierre: "Cuatro piezas, cada una por separado. (1) Plano de izaje con los puntos IDENTIFICADOS Y ACOTADOS, la capacidad de cada uno y cuales usa cada condicion de izaje: hoy solo existen como numeros de nodo del modelo, 126, 127, 128 y 129 arriba y 3472 y 3473 abajo, y como una figura sin una sola cota. (2) Diseno del yugo CONSISTENTE con la disposicion de eslingas y ganchos que el modelo STAAD asumio, o el modelo rehecho contra el yugo que se fabrique, mas la declaracion de quien lo suministra. NO basta con que el yugo exista: un yugo con otra geometria da otras tensiones y el analisis deja de aplicarle. (3) Diseno del punto de izaje POR LA RUTA QUE DECLAREN, porque hoy hay dos incompatibles y ninguna declarada: el Criterio de Diseno manda disenar un padeye con factor de seguridad 2,0 y carga lateral fuera de plano del 5 por ciento, y el calculo iza desde los esquineros ISO del contenedor. O el padeye disenado, O la constancia escrita de que los esquineros toman las reacciones calculadas SIN REFUERZO, con la base sobre la que se afirma. Si requieren refuerzo, el refuerzo disenado. (4) Memoria de calculo de izaje como documento propio, no embebida en el informe de 548 paginas, con el peso de izaje en kilogramos, que hoy no existe en ninguna parte. Todo revisado por el profesional de la orden del 09-Sep. AJUSTE 11-Sep-2026 tras la respuesta de BW Water: la pieza (3) queda fijada por la ruta que BW Water declaro, esquineros ISO sin padeye, y pasa a exigir la VERIFICACION LOCAL DEL PUNTO DE IZAJE: esquinero, poste de esquina y miembros del bastidor soldados a el bajo las reacciones de cada condicion, con FS 2,0 y 5 por ciento lateral, considerando la excentricidad de la carga (CG a 5.486 / 6.514 mm; tensiones 88,5 a 129,2 kN). El Rev 0 modela el izaje solo como global (reacciones en nodos) y no trae estado tensional del punto. Esa verificacion debe estar validada por el profesional de la revision estructural. La pieza (2) exige ademas que BW Water DESIGNE la condicion de izaje en sitio (superior con lifting frame o inferior a 30 grados) y entregue el yugo o arreglo disenado para ella; si es la inferior, los esquineros inferiores verificados bajo la componente horizontal. AJUSTE 15-Sep-2026 tras el addendum del 14-Sep: BW Water designo de hecho el izaje superior con lifting frame (cuatro W10x49 A36, gancho unico sobre el CG, eslingas a 45 grados minimo, izaje de prueba). La pieza (2) pasa a exigir el PLANO DE FABRICACION del yugo: dimensiones, uniones y soldaduras, puntos de eslinga en el marco y conexion del marco a los esquineros superiores, cada uno con su diseno. La pieza (1) debe traer ademas largos de eslinga o altura de gancho y el peso total con yugo y aparejos"
    fuente_contractual: "ET P22-ET-09-000-001-0 Seccion 7, pagina 29, dentro del Manual de Montaje: 'Memoria de Calculo para el izaje del modulo', 'Plano de izaje del modulo indicando los puntos de izaje, indicando claramente pesos' y 'Plano y diseno del yugo de Izaje para el modulo'. El padeye lo exige el propio Criterio de Diseno del proveedor, P22-CD-09-005-003 Rev 0 seccion F pagina 10: 'For the design of the padeye, a factor of safety, FS, of 2.0 shall be used. It shall also be designed for a lateral out of plane load equivalent to 5% of the gravity load'. Palanca de la misma Seccion 7 pagina 30: sin la aprobacion de toda la documentacion por parte de ADASA el Proveedor no podra liberar los equipos para transporte a terreno"
    origen_fecha: FIJADA ADASA
    fecha_origen: 2026-09-10
    fecha_cierre: null
    consecuencia: "ADASA iza el modulo con grua propia, porque la ET Seccion 9 pone el montaje en sitio y los equipos de izamiento de su lado. Sin peso de izaje, centro de gravedad y diseno del yugo no se contrata la grua. Hoy hay TRES pesos que no concuerdan y ninguno es el de izaje: 122,41 kN de peso sismico operativo en el calculo, 13.300 kg estimados en el plano de cargas Rev B y 32.500 kg de masa bruta ISO en la hoja del contenedor. Ademas la ET Seccion 8.1 hace de los puntos de izaje materia de verificacion dimensional en el FAT"
    accion_adasa: "Respuesta ENVIADA el 15-Sep-2026 (CORREOS/Septiembre 2026/2026-09-15/, misma cadena, Reply-All sobre el correo de BW Water del 14-Sep 23:04, CC mas Victor Gutierrez, ET completa adjunta), version ejecutiva de 224 palabras: pide que la revision de Thomas Engineers cubra el paquete completo y que manden su fecha de entrega; declara que el addendum no completa el paquete porque su Figura 16 repite las reacciones de la Condicion 1 del Rev 0 sin cotas; cita la ET Seccion 7 pag. 29 con los tres entregables literales; exige plano de fabricacion del yugo y la verificacion local pedida el 11-Sep; fija el jueves 17-Sep ligado a la Seccion 7 pag. 30, sin escribir el calculo de siete dias habiles (con el feriado del 18 la revision cerraria el 29). La ET no pide maniobra de izaje y no se exigio. Recordatorio ENVIADO el 14-Sep-2026 (CORREOS/Septiembre 2026/2026-09-14/, misma cadena, Reply-All sobre el correo del 11-Sep): BW Water no respondio nada al correo del 11; reitera el 15-Sep como fecha ultima, pide confirmar antes de esa fecha que la revision del profesional cubre el izaje y la condicion de izaje en sitio con el yugo o arreglo disenado para ella, y pide el enlace de la reunion semanal del miercoles 16-Sep a la hora habitual con el paquete en la agenda. Sin palancas nuevas ni cifras. Respuesta de ADASA ENVIADA el 11-Sep-2026 (CORREOS/Septiembre 2026/2026-09-11/, misma cadena, Reply-All): separa los dos izajes, el del forwarder y el de montaje en sitio en Taltal que hace ADASA con grua propia, y por eso la ET pide el diseno del yugo y no el yugo; toma la ruta declarada (esquineros ISO) y exige la verificacion local del punto bajo la excentricidad, validada por el profesional; devuelve la admision de que el izaje superior necesita lifting frame como el yugo de la ET; fija el 15-Sep; acepta la oferta de revisar el lifting plan del rigger y pide que queden en contacto con el forwarder y le compartan el procedimiento de izaje como base. Palancas en el cuerpo: solo ET Seccion 7 pag. 30 y Seccion 8.1; la BAE 43.1 a) y d) quedan aqui y en la Seccion 3 del proximo transmittal. Correo ENVIADO el 10-Sep-2026 en la cadena del Transmittal N39. Encabeza como oportunidad y no como reproche: la orden al profesional se coloco el 09-Sep con compromiso de cuatro dias, el izaje y el sismo viven en el mismo informe y en el mismo modelo STAAD, de modo que ampliar el alcance ahora cuesta una revision en vez de dos. NO se impone fecha por decision del usuario: se pide en la misma fecha que BW Water comprometio para la entrega del profesional y se le pide confirmarla"
    evidencia_origen: "ENTREGAS_BWWATER/ENTREGA 71/P22-CD-09-005-001_0 UHPRO Structural Calculation Report.pdf, cuyo indice salta de 'Bolt Design at the Base' a los anexos sin ninguna seccion de padeye, verificado por render porque el PDF no devuelve texto; ENTREGAS_BWWATER/ENTREGA 82/P22-CD-09-005-003_0_UHPRO STRUCTURAL DESIGN CRITERIA.pdf pagina 10, verificado por render; BASES TECNICAS/md/P22-ET-09-000-001-0-ET-MODULO.md"
    evidencia_cierre: null
    ref_cruzada: "PRG-32, PRG-08"
    reprogramaciones: 0
    historial_fechas: "Abierto el 10-Sep-2026 y reclamado por correo ENVIADO ese mismo dia, SIN FECHA a proposito: se pidio en la fecha del profesional y que la confirmaran. BW Water respondio el 11-Sep-2026 a las 9:18 sin dar fecha ni confirmar que la revision cubre el izaje, y el mismo 11-Sep ADASA FIJA el 15-Sep-2026, dia en que vencen los cuatro dias comprometidos el 09-Sep para el profesional (origen FIJADA ADASA). Cuenta como fecha inicial, no como reprogramacion. El 14-Sep-2026, sin respuesta de BW Water, ADASA envia un recordatorio que reitera el 15-Sep sin moverlo: no cuenta como reprogramacion. Si el paquete no llega el 15, se cuenta la primera reprogramacion solo si BW Water propone otra fecha. El 14-Sep-2026 a las 23:04 BW Water envia un addendum de una hoja que no completa el paquete, sin proponer fecha. El 15-Sep-2026 ADASA FIJA el jueves 17-Sep (origen FIJADA ADASA): por la regla anterior NO cuenta como reprogramacion, porque la fecha no la propuso BW Water. El 15-Sep queda como incumplimiento de la fecha fijada El 17-Sep-2026 vencio sin entrega. En la reunion del 16 (minuta automatica, no oponible) BW Water dijo que los planos de izaje con el yugo se terminan el viernes 18 y llegan el lunes 21 o martes 22, y que izaje y certificacion quedan resueltos al cierre de la semana del 21. En la del 17 (minuta ADASA P22-MI-10-000-002-0, desde la transcripcion Plaud; no enviada al cierre) dijo que la orden al profesional chileno esta emitida sin confirmacion y que su equipo estructural apunta a terminar calculos y planos del yugo el 18; ADASA tambien contactara al profesional. NO se mueve la fecha: las propuestas son verbales y en rango; si BW Water confirma por escrito una fecha, se registra como primera reprogramacion"
    nota: "DOS RUTAS DE IZAJE INCOMPATIBLES Y NINGUNA DECLARADA: el Criterio de Diseno manda disenar un padeye, una oreja que se suelda, y el calculo iza desde los esquineros ISO del contenedor, una pieza que ya existe. El informe NO verifica el esquinero contra la reaccion que el mismo calculo: cero apariciones de reinforcement, capacity e ISO 1496 en su texto extraible, y ninguna seccion de verificacion de puntos de izaje en su indice. La hoja de datos del contenedor es de enero de 2026, anterior a que el modulo se construyera dentro, y no menciona izaje. NO se exige norma para el esquinero, y es deliberado: la ET no fija ninguna para el izaje y exigirla seria over-reach. EL YUGO NO ES UN ACCESORIO QUE SE ELIJA DESPUES: es una hipotesis del calculo ya emitido. Las eslingas se modelaron uniendo los puntos de izaje a la disposicion de ganchos, y las cuatro tensiones que salen NO son iguales, 129,2 / 125,3 / 90,5 y 88,5 kN, por un centro de gravedad descentrado a lo largo del modulo, 5.486 mm de un lado y 6.514 del otro. Verificado por render sobre las Figuras 14 y 15, paginas 17 y 18 de 548. Parte del izaje SI esta entregada y por eso el reclamo es acotado: el calculo Rev 0 trae dos condiciones de izaje modeladas en STAAD, los factores 1,35 D y 2,0 D de API RP 2A-WSD, el centro de gravedad con tolerancia de 300 mm y la tension maxima de eslinga de 130 kN. Lo que falta es lo que convierte ese analisis en algo ejecutable, y no bajo a ningun plano. Este compromiso NO existia en el registro hasta hoy: el tema quedo archivado como contenido ya aprobado en los criterios Rev B del TM N25 y nadie lo siguio como entregable, pese a que el TM N25 declaro que 'the final lifting design follows as a separate deliverable'. Las vigas carrileras y los puntos de izaje internos de la ET Seccion 7 pagina 28 son un requisito DISTINTO, de mantencion, y tambien estan pendientes. RESPUESTA DE BW WATER DEL 11-Sep-2026 (Eduardo Yamauchi, firma De Nora Water Inc, Formerly BW Water Inc; tres comentarios con prefijo DWNT): (1) los criterios del padeye eran referencia para disenar los puntos de izaje y los miembros conectados, y un padeye no seria util porque el contenedor ya trae puntos de izaje con accesorios de mercado: CONFIRMA la ruta (esquineros ISO) y confirma que FS 2,0 y 5 por ciento gobiernan el punto, verificacion que el Rev 0 no trae. (2) Modelaron arriba y abajo para dar flexibilidad al sitio; el izaje superior necesita eslingas verticales y por tanto lifting frames, y el inferior solo accesorios de mercado con WLL adecuado: ADMITE que el izaje superior necesita el lifting frame, que es el yugo de la ET, y CONTRADICE su propia hoja de comentarios del 24-Jun-2026 a los Criterios Rev B (ENTREGA 55, respuesta al TM N23 OBS-03), que decia spreader beams will be needed so that only vertical forces are induced at the lifting points, base sobre la que ADASA aprobo los criterios en el TM N25; el izaje inferior a 30 grados induce la componente horizontal que el spreader debia evitar, y la Figura 15 del Rev 0 (verificada por render) lleva las cuatro eslingas inferiores a DOS puntos sobre el techo, uno por costado, de modo que tambien depende de un arreglo de gancho que hay que construir. (3) Reasigna el detalle al forwarder / rigging team citando un previous email que NO existe en los registros del proyecto, y ofrece revisar el lifting plan. NO respondio la fecha del profesional, ni si la revision cubre el izaje, ni las cuatro piezas, ni el peso de izaje. La misma hoja del 24-Jun comprometia final weight, COG and max load at the lifting points to be provided after we finish the design: el diseno se emitio para construccion el 23-Jul-2026 y nada de eso llego. PALANCAS RESERVADAS para el transmittal: BAE 43.1 a) (0,05 por ciento diario por atraso de la ingenieria de la ET Seccion 7) y 43.1 d) (el Manual de montaje con memoria de calculo para izaje, planos de izaje y diseno de yugo es documento principal cuya falta impide la Recepcion); PIE Base item 12 y Contrato C-4300 lo repiten. ADDENDUM DEL 14-Sep-2026 (P22-CD-09-005-003_UHPRO Structural Calculation Report - Addendum_RevA, Aulem, FOR REVIEW, archivado en CORREOS/_RECIBIDOS/Septiembre 2026/2026-09-14_Eduardo_Yamauchi_RE__TALTAL_-_Lifting_package_for_the_module_and_the_scope_of/adjuntos/): tres paginas con una sola hoja tecnica. Las cuatro cargas verticales de su Figura 16 (44,112 / 65,318 / 37,223 / 54,948 kN) son las reacciones de la Condicion 1 del Rev 0 a 2,0 D (nodos 126 a 129: 44,108 / 65,323 / 37,143 / 55,018 kN), y su peso vacio de 100,80 kN es esa suma dividida por 2,0. La figura no trae cotas. Usa el codigo de los Criterios de Diseno Rev 0, dice Rev A en portada y Rev B en cabecera, y Page 2 of 2 en tres paginas: a la Seccion 3 del proximo transmittal. La orden a Thomas Engineers se libero el 14-Sep, no el 09-Sep como decia la minuta. SUPOSICION: los angulos implicitos de la Figura 16 (carga vertical sobre tension) dan 37,9 a 44,9 grados, bajo su propio minimo de 45, no verificable sin cotas"

